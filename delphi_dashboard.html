<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delphi — Pre-Market Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0a0f;
      --bg2:     #111118;
      --bg3:     #18181f;
      --border:  rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text:    #e8e8f0;
      --muted:   #6b6b80;
      --accent:  #7b6ef6;
      --accent2: #9d91f8;
      --green:   #3dd68c;
      --red:     #f05252;
      --amber:   #f59e0b;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOPBAR ─────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 48px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--accent2);
    }

    .logo span { color: var(--muted); font-weight: 400; }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-tabs {
      display: flex;
      gap: 2px;
    }

    .nav-tab {
      padding: 5px 14px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--muted);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      background: none;
    }

    .nav-tab:hover  { color: var(--text); background: var(--bg3); }
    .nav-tab.active { color: var(--accent2); background: rgba(123,110,246,0.12); }

    .market-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── TWO-COLUMN LAYOUT ──────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      flex: 1;
      overflow: hidden;
    }

    .main {
      overflow-y: auto;
      padding: 20px 24px;
    }

    .main::-webkit-scrollbar        { width: 3px; }
    .main::-webkit-scrollbar-track  { background: transparent; }
    .main::-webkit-scrollbar-thumb  { background: var(--border2); border-radius: 2px; }

    /* ── SIDEBAR ────────────────────────────────────────── */
    .sidebar {
      border-left: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar::-webkit-scrollbar        { width: 3px; }
    .sidebar::-webkit-scrollbar-track  { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb  { background: var(--border2); border-radius: 2px; }

    .sidebar-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* ── SHARED UTILITIES ───────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .section-action {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    /* ── WATCHLIST STRIP ────────────────────────────────── */
    .watchlist-strip {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .watchlist-strip::-webkit-scrollbar        { height: 2px; }
    .watchlist-strip::-webkit-scrollbar-track  { background: transparent; }
    .watchlist-strip::-webkit-scrollbar-thumb  { background: var(--border2); border-radius: 1px; }

    .ticker-pill {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
      min-width: 80px;
    }

    .ticker-pill:hover  { border-color: var(--border2); }
    .ticker-pill.active { border-color: var(--accent); background: rgba(123,110,246,0.08); }

    .ticker-pill .sym {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .ticker-pill .chg {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .up   { color: var(--green); }
    .down { color: var(--red); }
    .flat { color: var(--muted); }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">DELPHI <span>/ pre-market</span></div>
  <div class="topbar-right">
    <div class="nav-tabs">
      <button class="nav-tab active" data-section="dashboard">dashboard</button>
      <button class="nav-tab" data-section="thesis">thesis</button>
      <button class="nav-tab" data-section="earnings">earnings</button>
    </div>
    <div class="market-status">
      <div class="dot"></div>
      <span id="clock">--:-- --</span>
    </div>
  </div>
</div>

<!-- TWO-COLUMN LAYOUT -->
<div class="layout">

  <!-- LEFT: MAIN PANEL -->
  <div class="main" id="main-panel">

    <!-- WATCHLIST STRIP -->
    <div id="section-dashboard">
      <div class="section-header">
        <span class="section-title">watchlist</span>
      </div>
      <div class="watchlist-strip" id="watchlist-strip"></div>
    </div>

  </div>

  <!-- RIGHT: CHAT SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">agent chat</div>
      <div style="font-size:11px; color:var(--muted);">Ask anything about your watchlist</div>
    </div>
    <!-- chat content rendered here -->
  </div>

</div>

<script>
const POLYGON_API_KEY = '2GXApNh5crjJPq7WGxM2XpMiRAp0uNzj';

// ── MARKET CLOCK ─────────────────────────────────────────
function updateClock() {
  const now = new Date();

  const timeStr = now.toLocaleTimeString('en-US', {
    timeZone: 'America/New_York',
    hour:     '2-digit',
    minute:   '2-digit',
    second:   '2-digit',
    hour12:   true,
  });

  const etHour = parseInt(now.toLocaleString('en-US', {
    timeZone: 'America/New_York',
    hour:     '2-digit',
    hour12:   false,
  }));
  const etMin = parseInt(now.toLocaleString('en-US', {
    timeZone: 'America/New_York',
    minute: '2-digit',
  }));
  const totalMin = etHour * 60 + etMin;

  let session, dotColor;
  if (totalMin >= 570 && totalMin < 960) {       // 9:30 – 16:00
    session  = 'market open';
    dotColor = 'var(--green)';
  } else if (totalMin >= 240 && totalMin < 570) { // 4:00 – 9:30
    session  = 'pre-market';
    dotColor = 'var(--amber)';
  } else if (totalMin >= 960 && totalMin < 1200) { // 16:00 – 20:00
    session  = 'after-hours';
    dotColor = 'var(--amber)';
  } else {
    session  = 'market closed';
    dotColor = 'var(--muted)';
  }

  document.getElementById('clock').textContent = `${timeStr} · ${session}`;
  document.querySelector('.dot').style.background = dotColor;
}

updateClock();
setInterval(updateClock, 1000);

// ── NAV TABS ─────────────────────────────────────────────
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = document.getElementById('section-' + tab.dataset.section);
    if (target) target.scrollIntoView({ behavior: 'smooth' });
  });
});

const CONFIG = {
  watchlist: ['AAPL', 'NVDA', 'TSLA', 'MSFT', 'AMD', 'CRWD', 'PLTR', 'ARM'],

  baskets: {
    saas: ['HOOD', 'MDB', 'ORCL', 'CSCO', 'CRWD', 'NOW', 'SNOW', 'MSFT', 'CRM', 'DDOG', 'PLTR', 'ZS'],
    semi: ['MRVL', 'NVDA', 'DELL', 'INTC', 'SMCI', 'QCOM', 'AMD', 'ARM', 'MU', 'SNDK', 'AVGO', 'TSM'],
  },

  theses: [
    {
      id: 'saas-semi',
      name: 'SAAS ↔ Semi inverse correlation',
      type: 'lagger',
      baskets: ['saas', 'semi'],
    },
    {
      id: 'spacex-wireless',
      name: 'SpaceX IPO → wireless rotation',
      type: 'static',
      tickers: ['VZ', 'T', 'TMUS'],
      signal: 'SIGNAL',
      notes: 'Monitor wireless names for unusual outflows as capital rotates into SpaceX-adjacent positions.',
    },
    {
      id: 'earnings-dislocation',
      name: 'Earnings dislocation tracker',
      type: 'earnings',
    },
  ],

  companyNames: {
    AAPL: 'Apple Inc.',
    NVDA: 'NVIDIA Corp.',
    TSLA: 'Tesla Inc.',
    MSFT: 'Microsoft Corp.',
    AMD:  'Advanced Micro Devices',
    CRWD: 'CrowdStrike Holdings',
    PLTR: 'Palantir Technologies',
    ARM:  'Arm Holdings',
  },

  laggerThreshold: 0.5,
  lagWindows: [20, 60],
};

// ── WATCHLIST STRIP ───────────────────────────────────────
function renderWatchlistStrip() {
  const strip = document.getElementById('watchlist-strip');
  strip.innerHTML = CONFIG.watchlist.map(ticker => `
    <div class="ticker-pill" id="pill-${ticker}" onclick="onPillClick('${ticker}')">
      <span class="sym">${ticker}</span>
      <span class="chg" id="pill-chg-${ticker}">—</span>
    </div>
  `).join('');
}

function onPillClick(ticker) {
  document.querySelectorAll('.ticker-pill').forEach(p => p.classList.remove('active'));
  document.getElementById('pill-' + ticker).classList.add('active');
}

renderWatchlistStrip();
</script>

</body>
</html>
